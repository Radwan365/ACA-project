# Copied into the image as /etc/nginx/conf.d/default.conf by the root Dockerfile.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in responses
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Health endpoint for the Application Gateway probe and the pipeline's smoke test
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Build output under /static/ has a content hash in the file name, so it can be cached for a long time
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: any path that is not a real file is handled by the React router in index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
