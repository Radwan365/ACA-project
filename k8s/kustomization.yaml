apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# Maps the placeholder image name "tm" in deployment.yaml to the real registry.
# The pipeline overrides newTag with the commit SHA (kustomize edit set image).
images:
  - name: tm
    newName: acrtmradwan.azurecr.io/tm
    newTag: latest
