apiVersion: apps/v1
kind: Deployment
metadata:
  name: tm
  namespace: tm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start a new pod before removing an old one, so capacity never drops during a release
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tm
    spec:
      # The app never calls the Kubernetes API, so it gets no API token
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tm
          # "tm" is a placeholder. kustomization.yaml maps it to the registry,
          # and the pipeline sets the tag to the commit SHA it just built.
          image: tm
          ports:
            - name: http
              containerPort: 8080
          # Only receives traffic once this passes
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          # Restarted if this keeps failing
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # nginx writes its pid file and temp files to /tmp; everything else is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
