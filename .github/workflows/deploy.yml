name: Terraform

# Pull requests: format check, validate, Checkov and plan.
# Push to main: the same, then apply.
# Weekly schedule: apply, so the TLS certificate is renewed before it expires.

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - ".github/workflows/deploy.yml"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - ".github/workflows/deploy.yml"

  schedule:
    # Mondays 05:17 UTC
    - cron: "17 5 * * 1"

  workflow_dispatch:

concurrency:
  group: terraform-tm-dev
  # Never cancel a running apply: it can leave the state locked and resources half-created
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_IN_AUTOMATION: true
  RESOURCE_GROUP: rg-tm-dev-eus
  AKS_CLUSTER_NAME: aks-tm-dev-eus

jobs:
  # A scheduled run must not rebuild an environment that was destroyed on purpose.
  # It only continues when the cluster exists. Every other trigger always continues.
  guard:
    name: decide whether to run
    # Dependabot pull requests have no access to the Azure secrets
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      - name: Azure login (OIDC)
        if: github.event_name == 'schedule'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif az aks show --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --output none 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cluster $AKS_CLUSTER_NAME not found. The environment is not deployed, so the scheduled run is skipped."
          fi

  terraform:
    name: plan and apply
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          skip_path: bootstrap
          output_format: cli
          quiet: false

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # Pull requests stop at the plan, so the change can be reviewed before it is applied
      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false tfplan
