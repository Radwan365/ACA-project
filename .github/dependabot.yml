version: 2

# Opens pull requests when a newer version of a dependency is released

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
